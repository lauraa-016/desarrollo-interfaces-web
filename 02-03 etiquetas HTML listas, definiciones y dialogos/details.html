<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        details {
            margin: 20px;
        }

        summary {
            list-style: none;
            cursor: pointer;
        }

        summary img {
            width: 500px;
            max-width: 90%;
            border-radius: 10px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Laura de la Mata</h1>

    <h1>6. Uso de details</h1>

    <p>Pulsa sobre cada imagen para ver su descripción.</p>

    <!-- IMAGEN 1 -->
    <details>
        <summary>
            <img src="imagenes/imagen1.jpg" alt="Programador escribiendo código">
        </summary>

        <p>
            Imagen de una persona programando con un portátil y un monitor.
        </p>
    </details>


    <!-- IMAGEN 2 -->
    <details>
        <summary>
            <img src="imagenes/imagen2.jpg" alt="Programador trabajando con varios monitores">
        </summary>

        <p>
            Imagen de un espacio de trabajo con varios monitores utilizados para programar.
        </p>
    </details>


    <!-- IMAGEN 3 -->
    <details>
        <summary>
            <img src="imagenes/imagen3.jpg" alt="Código fuente en pantalla">
        </summary>

        <p>
            Imagen de código fuente mostrado en la pantalla de un ordenador.
        </p>
    </details>

</body>

</html>
