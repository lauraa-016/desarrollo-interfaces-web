<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 6 - SRCSET</title>

</head>

<body>

    <h1>Ejercicio 6 - Imágenes responsive con SRCSET</h1>

    <p>
        El navegador elegirá automáticamente la imagen más adecuada
        dependiendo del tamaño de pantalla y de la resolución.
    </p>

    <img
        src="imagenes/paisaje-800.jpg"

        srcset="
            imagenes/paisaje-400.jpg 400w,
            imagenes/paisaje-800.jpg 800w,
            imagenes/paisaje-1200.jpg 1200w,
            imagenes/paisaje-1600.jpg 1600w
        "

        sizes="(max-width: 600px) 100vw,
               (max-width: 1000px) 80vw,
               1200px"

        alt="Paisaje de montaña"
        width="1600"
        height="900"
    >

</body>

</html>
