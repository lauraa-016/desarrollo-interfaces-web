<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Tablas anidadas</title>
</head>

<body>

    <table border="1" width="440" style="border-collapse: collapse; background-color: #dddddd;">

        <!-- Cabecera principal -->
        <tr style="background-color: #666666; color: white;">
            <th colspan="2">
                Climas de América del Sur
            </th>
        </tr>

        <!-- Parte superior -->
        <tr>
            <td width="50%" valign="top" style="color: white; font-weight: bold;">
                Parte de arriba de América del Sur.
                Países como:
            </td>

            <td width="50%" valign="top">
                <!-- Tabla anidada -->
                <table border="0" width="100%">
                    <tr>
                        <td width="40%" valign="top">
                            Parte de América Sur. Países
                        </td>

                        <td width="35%" style="background-color: white;">
                        </td>

                        <td width="25%" valign="top">
                            abajo del como:
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- Parte inferior -->
        <tr style="background-color: #378493;">

            <td width="50%" valign="top" align="center">
                <b>Bosque tropical,</b><br>
                clima de sabana,<br>
                clima marítimo<br>
                con inviernos<br>
                secos.
            </td>

            <td width="50%" valign="top" align="center">
                Climas marítimos<br>
                con veranos secos,<br>
                climas <u>fríos</u>,<br>
                clima de estepa,<br>
                clima desértico.
            </td>

        </tr>

    </table>

</body>

</html>
