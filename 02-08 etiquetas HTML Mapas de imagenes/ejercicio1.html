<!DOCTYPE html>
<html lang="es">

<head>

<body>

      <h1>Ejercicio 1. Mapa de imágenes cuadrados</h1>

      <p>Selecciona una de las cuatro zonas de la imagen.</p>


      <img src="./assets/mcb.png" alt="Mapa de imágenes con seis botones" usemap="#mapaCuadrados" width="454"
            height="287">


      <map name="mapaCuadrados">

            <area shape="rect" coords="12,20,218,91" href="#hardware" alt="Hardware"
                  onclick="alert('Has seleccionado Hardware')">

            <area shape="rect" coords="230,20,440,91" href="#supermini" alt="Super Mini"
                  onclick="alert('Has seleccionado Super Mini')">

            <area shape="rect" coords="12,112,218,183" href="#verydirty" alt="Very Dirty"
                  onclick="alert('Has seleccionado Very Dirty')">

            <area shape="rect" coords="230,112,440,183" href="#digg" alt="Digg this"
                  onclick="alert('Has seleccionado Digg this')">

      </map>




</body>
